<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlickStore - Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <a class="brand" href="index.html">
        <span class="brand-mark">K</span>
        <h1>KlickStore</h1>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="content">

    <h2>Get in Touch</h2>

    <form>

        <label for="fullname">Full Name</label>
        <input id="fullname" type="text" placeholder="Enter your name">

        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="Enter your email">

        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Enter your message"></textarea>

        <button type="button" onclick="contactMessage()">
            Send Message
        </button>

    </form>

    <h3>Contact Information</h3>

    <p>Email: support@klickstore.com</p>
    <p>Phone: +91 00000 00000</p>
    <p>Location: Kochi, Kerala, India</p>

</section>

<footer>
    <p>&copy; 2026 KlickStore. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
